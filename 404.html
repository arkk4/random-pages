<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Page not found</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#09090b;--surface:#121215;--card:#18181b;--grid:#1e1e22;--edge:#27272a;--mid:#52525b;--mut:#71717a;--hi:#a1a1aa;--ink:#f4f4f5;
--top:#121215;--r:#0d0d10;--l:#09090b;--num-fill:#16161a;--num-stroke:#232329;--sam-fl:#18181b;--sam-fr:#1f1f23;--sam-ft:#27272a;
--body:#333338;--ext:#131316;--ln:#18181b;--blue:#38bdf8;--red:#fb7185;--fire:#f59e0b}
:root[data-theme="light"]{color-scheme:light;--bg:#fafafa;--surface:#fff;--card:#f4f4f5;--grid:#e4e4e7;--edge:#d4d4d8;--mid:#a1a1aa;--mut:#71717a;--hi:#3f3f46;--ink:#09090b;
--top:#fff;--r:#e4e4e7;--l:#d4d4d8;--num-fill:#f4f4f5;--num-stroke:#e4e4e7;--sam-fl:#e4e4e7;--sam-fr:#d4d4d8;--sam-ft:#f4f4f5;
--body:#27272a;--ext:#18181b;--ln:#09090b;--blue:#0284c7;--red:#e11d48;--fire:#d97706}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#fafafa;--surface:#fff;--card:#f4f4f5;--grid:#e4e4e7;--edge:#d4d4d8;--mid:#a1a1aa;--mut:#71717a;--hi:#3f3f46;--ink:#09090b;
--top:#fff;--r:#e4e4e7;--l:#d4d4d8;--num-fill:#f4f4f5;--num-stroke:#e4e4e7;--sam-fl:#e4e4e7;--sam-fr:#d4d4d8;--sam-ft:#f4f4f5;
--body:#27272a;--ext:#18181b;--ln:#09090b;--blue:#0284c7;--red:#e11d48;--fire:#d97706}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:16px}
.stage{position:relative;width:100%;max-width:960px}
svg{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fl,.fr,.ft{stroke:var(--edge);stroke-width:.8;stroke-linejoin:round}
.fl{fill:var(--l)}.fr{fill:var(--r)}.ft{fill:var(--top)}
.gl{stroke:var(--grid);stroke-width:.7;fill:none}
.num{font:800 132px/1 system-ui,sans-serif;letter-spacing:-.05em;text-anchor:middle;fill:var(--num-fill);stroke:var(--num-stroke);stroke-width:1.2px;user-select:none;pointer-events:none}
.b{--acc:var(--blue)}.r{--acc:var(--red)}
.hull{fill:var(--body);stroke:var(--edge);stroke-width:.65;stroke-linejoin:round}
.ext{fill:var(--ext);stroke:var(--ln);stroke-width:.65;stroke-linejoin:round}
.dk{fill:var(--ext);stroke:var(--ln);stroke-width:.3}
.hl{fill:none;stroke:rgba(255,255,255,.14);stroke-width:.5;stroke-linecap:round}
.cny{fill:var(--acc);fill-opacity:.78;stroke:var(--ln);stroke-width:.5}
.acc{stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;fill:none}
.pole{stroke:var(--mid);stroke-width:1.2;stroke-linecap:round;stroke-opacity:.45;stroke-dasharray:2 3}
.shd{fill:#000;fill-opacity:.35}.bs{fill:var(--edge);stroke:var(--ln);stroke-width:.6}
.fan{fill:var(--acc);fill-opacity:.025;stroke:var(--acc);stroke-opacity:.35;stroke-dasharray:3 3;stroke-width:.75}
.trk .fan{fill-opacity:.06}
.cone{fill:var(--acc);fill-opacity:.05;stroke:var(--acc);stroke-width:.75}
.lock .cone{fill-opacity:.22}
.sr{fill:var(--acc);fill-opacity:.03;stroke:var(--acc);stroke-opacity:.55;stroke-width:.9;stroke-dasharray:4 4}
.sr.in{fill-opacity:.14;stroke-opacity:.9}
.af{fill:var(--acc);fill-opacity:.14;stroke:var(--acc);stroke-width:1}
#lk line{stroke-width:1.1;stroke-dasharray:4 3}
.rt{font:700 9px ui-monospace,monospace;fill:var(--acc);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.lb{font:600 9px ui-monospace,monospace;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
#s:not(.vb) .rt,#s:not(.vb) .lb{display:none}
#s:not(.radar) .wd,#s:not(.radar) .sr{display:none}
#s:not(.aim) #lk,#s:not(.aim) #tgl{display:none}
.fld button{padding:0 8px}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 28px;width:100%;max-width:860px;padding:10px 14px;background:var(--surface);border:1px solid var(--edge);border-radius:10px;font:12px ui-monospace,Menlo,monospace;color:var(--hi)}
.sp[hidden]{display:none}
.sp h2{margin:0 0 4px;font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sp div{display:grid;grid-template-columns:1fr 4em 4em;gap:8px;padding:1px 0}
.sp div span{color:var(--mut)}.sp b{font-weight:600;text-align:right}.sp b.b{color:var(--blue)}.sp b.r{color:var(--red)}
.sam{fill:none;stroke:var(--ln);stroke-width:.7}
.sm .fl{fill:var(--sam-fl)}.sm .fr{fill:var(--sam-fr)}.sm .ft{fill:var(--sam-ft)}
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;width:100%;max-width:860px;padding:8px 14px;background:var(--surface);border:1px solid var(--edge);border-radius:10px;font-size:12px;color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.stp{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.stp .dot{width:7px;height:7px;border-radius:50%}
.stp.b .dot{background:var(--blue)}.stp.r .dot{background:var(--red)}
.stp button{width:24px;height:24px;border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink);font:500 14px/1 ui-monospace,monospace;cursor:pointer;padding:0}
.stp button:hover:not(:disabled){background:var(--edge)}.stp button:disabled{opacity:.3;cursor:default}
.stp output{min-width:1ch;text-align:center;font:600 13px ui-monospace,Menlo,monospace;color:var(--ink)}
.fld{display:inline-flex;background:var(--card);padding:2px;border-radius:7px;border:1px solid var(--edge)}
.fld button{height:22px;min-width:28px;border:0;border-radius:5px;background:transparent;color:var(--mut);font:600 11px system-ui,sans-serif;cursor:pointer}
.fld button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--edge);border-radius:7px;background:var(--card);color:var(--mut);cursor:pointer;padding:0}
.theme-btn:hover{background:var(--edge);color:var(--ink)}
.sun-icon{display:none}.moon-icon{display:block}
:root[data-theme="light"] .sun-icon{display:block}:root[data-theme="light"] .moon-icon{display:none}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font:500 12px ui-monospace,Menlo,monospace;color:var(--hi)}
.st span{color:var(--mut);margin-right:4px}.st b{font-weight:600}.st b.b{color:var(--blue)}.st b.r{color:var(--red)}
.txt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
p{margin:0;font-size:13px;color:var(--mut)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:640px){.hud{justify-content:center}}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <svg id="s" viewBox="0 0 800 500" role="img" aria-label="404: animated air campaign over a table marked 404"></svg>
  </div>
  <div class="hud">
    <div class="ctl">
      <label class="stp b" title="Blue jets"><span class="dot"></span><button data-s="0" data-d="-1" aria-label="Fewer blue jets">&minus;</button><output id="n0">4</output><button data-s="0" data-d="1" aria-label="More blue jets">+</button></label>
      <label class="stp r" title="Red jets"><span class="dot"></span><button data-s="1" data-d="-1" aria-label="Fewer red jets">&minus;</button><output id="n1">4</output><button data-s="1" data-d="1" aria-label="More red jets">+</button></label>
      <div class="fld" role="group" aria-label="Field size">
        <button data-f="700" aria-pressed="false" title="Small field">S</button>
        <button data-f="950" aria-pressed="true" title="Medium field">M</button>
        <button data-f="1300" aria-pressed="false" title="Large field">L</button>
      </div>
      <div class="fld" id="tg" role="group" aria-label="Overlays">
        <button data-o="vb" aria-pressed="false" title="Roles and weapon labels">Labels</button>
        <button data-o="radar" aria-pressed="false" title="Radar cones and SAM engagement zones">Radar</button>
        <button data-o="aim" aria-pressed="false" title="Targeting and lock lines">Aim</button>
        <button data-o="stats" aria-pressed="false" title="Detailed statistics">Stats</button>
      </div>
      <button class="theme-btn" id="t-btn" aria-label="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
  <div id="sp" class="sp" hidden></div>
  <div class="txt">
    <h1>Page not found</h1>
    <p>Looks like it was shot down. Click a jet, a SAM site or an airfield to intervene.</p>
  </div>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),cx=400,cy=248,D=Math.PI/180,f=n=>n.toFixed(1),R=Math.random;
let H=950,Z=1,SCL=1,VS=1;const zs=z=>z*Math.sqrt(Z),P=(x,y,z=0)=>[cx+.866*(x-y)*Z,cy+.5*(x+y)*Z-zs(z)];
const pt=a=>a.map(p=>f(p[0])+','+f(p[1])).join(' ');
const poly=(a,c)=>`<polygon points="${pt(a)}" class="${c}"/>`;
const box=(x0,y0,x1,y1,z0,z1)=>poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],'fl')+poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],'fr')+poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],'ft');
const sec=(r,a)=>`M0 0L${f(r*Math.cos(-a*D))} ${f(r*Math.sin(-a*D))}A${r} ${r} 0 0 1 ${f(r*Math.cos(a*D))} ${f(r*Math.sin(a*D))}Z`;
const mir=g=>g(1)+g(-1);
const mk=h=>{const F=h.concat(h.slice(1,-1).reverse().map(([x,y])=>[x,-y]));return'M'+F.map(p=>p.join(' ')).join('L')+'Z'};
const hullD0=mk([[28,0],[20,2],[9,3.3],[-9,17],[-14,17],[-15,4],[-24,3],[-26,1.6],[-27,0]]);
const B0=`<path class="acc" d="M-6 0H-20"/>`+mir(s=>`<path class="hl" d="M2.8 ${8*s}H-14.6M-2.4 ${12*s}H-14.3M-7 ${15.5*s}H-14.1"/><path class="hull" d="M16 ${2.47*s}L11.5 ${7.8*s}L9.5 ${7.8*s}L12 ${2.95*s}Z"/><rect class="dk" x="8.5" y="${s>0?2.7:-4.3}" width="4.5" height="1.6"/><rect class="dk" x="-13" y="${s>0?17.2:-18.4}" width="4" height="1.2"/>`)+`<circle class="dk" cx="-26.5" cy="0" r="1.8"/><ellipse class="cny" cx="12" cy="0" rx="5.5" ry="1.9"/><circle class="dk" cx="19.5" cy="0" r="1.1"/><path class="hl" d="M22.5 -1.2V1.2M24 -.8V.8"/>`;
const FM=()=>`matrix(${.866*Z} ${.5*Z} ${-.866*Z} ${.5*Z} ${cx} ${cy})`,N=16,side=i=>i<8?0:1;
const jet=i=>`<g id="g${i}" class="${side(i)?'r':'b'}"><line class="pole" id="pl${i}"/><g id="jl${i}"><g transform="${FM()}"><g id="ps${i}"><g transform="translate(3.5 3.5)"><g id="rx${i}"><use href="#hull0" class="ext"/></g></g><g id="rb${i}"><use href="#hull0" class="hull"/>${B0}</g></g></g><text id="rt${i}" class="rt" text-anchor="middle"></text></g></g>`;

/* ---- Western armament (ranges/speeds scaled to the field; gun range exaggerated for visibility) ---- */
const WP={ir:{v:150,w:3.2,pk:.7,rg:60},      // AIM-9X Sidewinder (IR, short)
 mr:{v:170,w:2.4,pk:.6,rg:190},             // AIM-120C-7 AMRAAM (medium)
 lr:{v:190,w:2.2,pk:.65,rg:300},            // AIM-120D (long)
 arm:{v:190,w:1.6,pk:.75,rg:170},           // AGM-88E AARGM (anti-radiation)
 sl:{v:150,w:2.4,pk:.6,rg:140},             // MIM-104 Patriot PAC-3
 ss:{v:140,w:2.6,pk:.5,rg:80}};             // NASAMS / IRIS-T SLM
const BM={g31:{br:18,dmg:40,sg:7},g12:{br:11,dmg:20,sg:10}}; // GBU-31 JDAM (Mk-84), GBU-12 Paveway II (Mk-82)
const GUN={rg:16,burst:45,mag:510,pk:.22};                    // M61A1 Vulcan 20 mm, 510 rds, 1 hit != kill
const LOAD={CAP:{ir:2,mr:2,lr:4,arm:0,g31:0,g12:0},SEAD:{ir:2,mr:2,lr:0,arm:2,g31:0,g12:0},STR:{ir:2,mr:2,lr:0,arm:0,g31:2,g12:2}};
const RL={CAP:'CAP',SEAD:'SEAD',STR:'STRIKE'};
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),cl=(v,a)=>Math.max(-a,Math.min(a,v));
const reff=(m,z)=>m.r*(.55+.45*Math.min(1,z/90));   // low-flying jets are harder to see
const dist3=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y,(b.z-a.z)*.9);
let AF=[],SM=[],EL=[],M=[],X=[],lure={t:0},T0=0,mid=0,JS=.85;
const sc=[0,0],ST={sk:[0,0],ch:[0,0],h:'',f:[{},{}],hit:[0,0],lost:[0,0]},cnt=[4,4];
const J=Array.from({length:N},(_,i)=>({s:side(i),k:i%8,on:i%8<4?1:0,air:1}));

function layout(){const o=[],n=Math.max(6,Math.round(2*H*H/110000)),nc=Math.ceil(Math.sqrt(n/2)),nr=Math.ceil(n/nc);
[0,1].forEach(s=>{const g=s?1:-1;for(let i=0;i<n;i++){const c=i%nc,r=Math.floor(i/nc),j1=Math.sin(i*12.9+s*7.3)*.5,j2=Math.sin(i*78.2+s*3.1)*.5,l=i%3===1;
o.push({x:g*H*(.08+.66*(c+.5+j1*.8)/nc),y:((r+.5+j2*.8)/nr*2-1)*.92*H,s,r:l?120:60,wp:l?'sl':'ss',mx:l?4:6,rr:10,t:l?'l':'s'})}});return o}
function build(){
let g=`<defs><path id="hull0" d="${hullD0}"/><clipPath id="pc"><rect x="${-H+4}" y="${-H+4}" width="${2*H-8}" height="${2*H-8}" rx="10"/></clipPath></defs>`;
for(const[a,b]of[[-H+28,-H+28],[H-64,-H+28],[-H+28,H-64],[H-64,H-64]])g+=box(a,b,a+36,b+36,-20,-12);
g+=box(-H,-H,H,H,-12,0);
let fl=`<g transform="${FM()}"><g clip-path="url(#pc)">`;
for(let k=-Math.floor(H/100)*100;k<=H;k+=100)fl+=`<path class="gl" d="M${k} ${-H}V${H}M${-H} ${k}H${H}"/>`;
fl+=`<text class="num" transform="rotate(-45) scale(${f(H/190)})" x="0" y="0" dy=".35em">404</text>`;
AF.forEach(a=>fl+=`<g id="af${a.s}" class="${a.s?'r':'b'}"><rect class="af" x="${a.x-a.w}" y="${-a.w*.21}" width="${2*a.w}" height="${a.w*.42}" rx="3"/><path class="gl" style="stroke:var(--acc);stroke-dasharray:6 5" d="M${a.x-a.w*.88} 0H${a.x+a.w*.88}"/></g>`);
fl+=SM.map((m,k)=>`<circle class="sr ${m.s?'r':'b'}" id="sr${k}" cx="${m.x}" cy="${m.y}" r="${m.r}"/>`).join('');
for(let i=0;i<N;i++)fl+=`<g id="w${i}" class="wd ${side(i)?'r':'b'}"><path class="fan" id="fa${i}"/><path class="cone" id="co${i}"/></g>`;
for(let i=0;i<N;i++)fl+=`<g id="sh${i}"><use href="#hull0" class="shd"/></g><circle class="bs" id="bs${i}" r="4"/>`;
fl+=`</g><rect class="gl" style="stroke:var(--edge)" x="${-H+8}" y="${-H+8}" width="${2*H-16}" height="${2*H-16}" rx="8"/></g>`;
g+=fl;
const sam=(m,k)=>{const{x,y}=m,q=(m.t==='l'?1.9:1.3)*SCL,c=m.s?'--red':'--blue';let h=`<g class="sm" id="sm${k}">`+box(x-12*q,y-12*q,x+12*q,y+12*q,0,5)+box(x-8*q,y-8*q,x+8*q,y+8*q,5,8);
for(let i=0;i<3;i++)h+=box(x-7*q,y+(-8+i*6)*q,x+7*q,y+(-3.5+i*6)*q,8,14);const d=P(x,y,19);return h+`<ellipse class="sam" cx="${f(d[0])}" cy="${f(d[1])}" rx="5.8" ry="3.2" style="fill:var(${c})"/></g>`};
const it=[];SM.forEach((m,k)=>it.push([m.x+m.y,()=>sam(m,k)]));
AF.forEach(a=>[-1,1].forEach(o=>{const oo=o*a.w*1.5,h=a.w*.2;it.push([a.x+a.y+oo,()=>box(a.x-a.w*.6,oo-h,a.x+a.w*.6,oo+h,0,9)])}));
it.sort((a,b)=>a[0]-b[0]).forEach(e=>g+=e[1]());
g+='<g id="jets">'+Array.from({length:N},(_,i)=>jet(i)).join('')+'</g><g id="tgl"></g><g id="lk"></g><g id="mg"></g><g id="fx"></g>';
$('#s').innerHTML=g}

function park(j){const A=AF[j.s];j.x=A.x;j.y=(j.k-3.5)*14*SCL;j.z=0;j.h=j.s?Math.PI:0}
function reset(){Z=190/H;SCL=Math.sqrt(H/520);VS=Math.pow(H/520,.6);JS=.85*(.5+.5*Z)/Z;
AF=[0,1].map(s=>({x:(s?1:-1)*H*.82,y:0,s,hp:100,rs:0,rr:46*SCL,w:52*SCL,af:1}));
SM=layout().map(m=>Object.assign(m,{z:8,cd:2+R()*3,am:m.mx,emit:0,in:0,alive:1,hp:1,rs:0,rl:0,kills:0}));
build();
SM.forEach((m,k)=>{m.el=$('#sr'+k);m.gw=$('#sm'+k)});
EL=J.map((_,i)=>Object.fromEntries(['g','sh','bs','w','jl','ps','rx','rb','pl','fa','co','rt'].map(n=>[n,$('#'+n+i)])));
J.forEach((j,i)=>{Object.assign(j,{st:'g',gt:2+j.k*2.2,alive:j.on,hp:2,cm:30,gun:GUN.mag,a:{...LOAD.CAP},role:'CAP',fu:100,cd:0,gc:0,lt:0,lk:-1,tr:0,rs:0,jk:1,jt:0,kills:0,sp:0,tg:null,gate:null,rt:0});park(j);
EL[i].fa.setAttribute('d',sec(340,55));EL[i].co.setAttribute('d',sec(300,40))});
M.length=0;X=[];sc[0]=sc[1]=0;ST.sk=[0,0];ST.ch=[0,0];ST.h='';ST.f=[{},{}];ST.hit=[0,0];ST.lost=[0,0];T0=0;lure={t:0}}
reset();

const NM={ir:'AIM-9X',mr:'AIM-120C',lr:'AIM-120D',arm:'AGM-88E',g31:'GBU-31',g12:'GBU-12'},lbl=(o,s)=>X.push({t:0,k:'l',x:o.x,y:o.y,z:o.z||8,s}),fire=(o,tg,t,k)=>{const w=WP[t];M.push({x:o.x,y:o.y,z:o.z||8,h:o.h!==undefined&&o.air?o.h:Math.atan2(tg.y-o.y,tg.x-o.x),tg,side:o.s,k,v:w.v,w:w.w,pk:w.pk,rg:w.rg*1.25,src:o,age:0,id:++mid,tr:[]});ST.f[o.s][t]=(ST.f[o.s][t]||0)+1;if(k!=='s')lbl(o,NM[t])};
