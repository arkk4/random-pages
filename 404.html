<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Page not found</title>
<style>
:root {
  box-sizing: border-box;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Zinc Dark Palette */
  --bg: #09090b;
  --surface: #121215;
  --card: #18181b;
  --grid: #1e1e22;
  --edge: #27272a;
  --mid: #52525b;
  --mut: #71717a;
  --hi: #a1a1aa;
  --ink: #f4f4f5;

  /* Table Isometric */
  --top: #121215;
  --r: #0d0d10;
  --l: #09090b;
  --num-fill: #16161a;
  --num-stroke: #232329;

  /* SAM Colors */
  --sam-fl: #18181b;
  --sam-fr: #1f1f23;
  --sam-ft: #27272a;

  /* Jet Model Palette */
  --body: #333338;
  --ext: #131316;
  --ln: #18181b;

  --blue: #38bdf8;
  --red: #fb7185;
  --fire: #f59e0b;
}

/* Zinc Light Palette */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fafafa;
  --surface: #ffffff;
  --card: #f4f4f5;
  --grid: #e4e4e7;
  --edge: #d4d4d8;
  --mid: #a1a1aa;
  --mut: #71717a;
  --hi: #3f3f46;
  --ink: #09090b;

  --top: #ffffff;
  --r: #e4e4e7;
  --l: #d4d4d8;
  --num-fill: #f4f4f5;
  --num-stroke: #e4e4e7;

  --sam-fl: #e4e4e7;
  --sam-fr: #d4d4d8;
  --sam-ft: #f4f4f5;

  --body: #27272a;
  --ext: #18181b;
  --ln: #09090b;

  --blue: #0284c7;
  --red: #e11d48;
  --fire: #d97706;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --card: #f4f4f5;
    --grid: #e4e4e7;
    --edge: #d4d4d8;
    --mid: #a1a1aa;
    --mut: #71717a;
    --hi: #3f3f46;
    --ink: #09090b;

    --top: #ffffff;
    --r: #e4e4e7;
    --l: #d4d4d8;
    --num-fill: #f4f4f5;
    --num-stroke: #e4e4e7;

    --sam-fl: #e4e4e7;
    --sam-fr: #d4d4d8;
    --sam-ft: #f4f4f5;

    --body: #27272a;
    --ext: #18181b;
    --ln: #09090b;

    --blue: #0284c7;
    --red: #e11d48;
    --fire: #d97706;
  }
}

*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s ease, color .2s ease;
}
main {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  gap: 16px;
}
.stage {
  position: relative;
  width: 100%;
  max-width: 860px;
}
svg {
  position: relative;
  display: block;
  width: 100%;
  height: auto;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Isometric Board & Grid */
.fl, .fr, .ft { stroke: var(--edge); stroke-width: .8; stroke-linejoin: round; }
.fl { fill: var(--l); }
.fr { fill: var(--r); }
.ft { fill: var(--top); }
.gl { stroke: var(--grid); stroke-width: .7; fill: none; }
.rg { stroke-dasharray: 3 4; }
.num {
  font: 800 132px/1 system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  letter-spacing: -0.05em;
  text-anchor: middle;
  fill: var(--num-fill);
  stroke: var(--num-stroke);
  stroke-width: 1.2px;
  user-select: none;
  pointer-events: none;
}

/* Jet Model & Flight Aesthetics */
.b { --acc: var(--blue); }
.r { --acc: var(--red); }
.hull { fill: var(--body); stroke: var(--edge); stroke-width: .65; stroke-linejoin: round; }
.ext { fill: var(--ext); stroke: var(--ln); stroke-width: .65; stroke-linejoin: round; }
.dk { fill: var(--ext); stroke: var(--ln); stroke-width: .3; }
.hl { fill: none; stroke: rgba(255,255,255,.14); stroke-width: .5; stroke-linecap: round; }
.cny { fill: var(--acc); fill-opacity: .78; stroke: var(--ln); stroke-width: .5; }
.acc { stroke: var(--acc); stroke-width: 1.5; stroke-linecap: round; fill: none; }
.pole { stroke: var(--mid); stroke-width: 1.2; stroke-linecap: round; stroke-opacity: .45; stroke-dasharray: 2 3; }
.shd { fill: #000; fill-opacity: .35; }
.bs { fill: var(--edge); stroke: var(--ln); stroke-width: .6; }

/* Radar & Weapons */
.fan { fill: var(--acc); fill-opacity: .025; stroke: var(--acc); stroke-opacity: .35; stroke-dasharray: 3 3; stroke-width: .75; }
.trk .fan { fill-opacity: .06; }
.cone { fill: var(--acc); fill-opacity: .05; stroke: var(--acc); stroke-width: .75; }
.lock .cone { fill-opacity: .22; }
.sr { fill: var(--acc); fill-opacity: .03; stroke: var(--acc); stroke-opacity: .55; stroke-width: .9; stroke-dasharray: 4 4; }
.sr.in { fill-opacity: .14; stroke-opacity: .9; }
#lk line { stroke-width: 1.1; stroke-dasharray: 4 3; }
.sam { fill: none; stroke: var(--ln); stroke-width: .7; }
.sm .fl { fill: var(--sam-fl); }
.sm .fr { fill: var(--sam-fr); }
.sm .ft { fill: var(--sam-ft); }

/* HUD Control Bar */
.hud {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  width: 100%;
  max-width: 740px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: 10px;
  font-size: 12px;
  color: var(--mut);
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.ctl {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}
.stp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.stp .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.stp.b .dot { background: var(--blue); }
.stp.r .dot { background: var(--red); }
.stp button {
  width: 24px;
  height: 24px;
  border: 1px solid var(--edge);
  border-radius: 6px;
  background: var(--card);
  color: var(--ink);
  font: 500 14px/1 ui-monospace, monospace;
  cursor: pointer;
  padding: 0;
  transition: background .15s, border-color .15s;
}
.stp button:hover:not(:disabled) { background: var(--edge); }
.stp button:disabled { opacity: .3; cursor: default; }
.stp output {
  min-width: 1ch;
  text-align: center;
  font: 600 13px ui-monospace, Menlo, Consolas, monospace;
  color: var(--ink);
}
.fld {
  display: inline-flex;
  background: var(--card);
  padding: 2px;
  border-radius: 7px;
  border: 1px solid var(--edge);
}
.fld button {
  height: 22px;
  min-width: 28px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--mut);
  font: 600 11px system-ui, sans-serif;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.fld button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--edge);
  border-radius: 7px;
  background: var(--card);
  color: var(--mut);
  cursor: pointer;
  padding: 0;
  transition: background .15s, color .15s;
}
.theme-btn:hover {
  background: var(--edge);
  color: var(--ink);
}
.sun-icon { display: none; }
.moon-icon { display: block; }
:root[data-theme="light"] .sun-icon { display: block; }
:root[data-theme="light"] .moon-icon { display: none; }

.st {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  font: 500 12px ui-monospace, Menlo, Consolas, monospace;
  color: var(--hi);
}
.st span { color: var(--mut); margin-right: 4px; }
.st b { font-weight: 600; }
.st b.b { color: var(--blue); }
.st b.r { color: var(--red); }

/* Typography */
.txt {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 4px;
  margin-top: 2px;
}
h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
}
p {
  margin: 0;
  font-size: 13px;
  color: var(--mut);
}
button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
@media (max-width: 640px) {
  .hud { justify-content: center; }
}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <svg id="s" viewBox="0 0 800 500" role="img" aria-label="404: animated tactical air battle over a table marked 404"></svg>
  </div>

  <div class="hud">
    <div class="ctl">
      <label class="stp b" title="Blue jets">
        <span class="dot"></span>
        <button data-s="0" data-d="-1" aria-label="Fewer blue jets">&minus;</button>
        <output id="n0">1</output>
        <button data-s="0" data-d="1" aria-label="More blue jets">+</button>
      </label>
      <label class="stp r" title="Red jets">
        <span class="dot"></span>
        <button data-s="1" data-d="-1" aria-label="Fewer red jets">&minus;</button>
        <output id="n1">1</output>
        <button data-s="1" data-d="1" aria-label="More red jets">+</button>
      </label>
      <div class="fld" role="group" aria-label="Field size">
        <button data-f="190" aria-pressed="true" title="Small field (4 SAMs)">S</button>
        <button data-f="260" aria-pressed="false" title="Medium field (6 SAMs)">M</button>
        <button data-f="330" aria-pressed="false" title="Large field (8 SAMs)">L</button>
      </div>
      <button class="theme-btn" id="t-btn" aria-label="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
    <div id="st" class="st"></div>
  </div>

  <div class="txt">
    <h1>Page not found</h1>
    <p>Looks like it was shot down. Click a jet, a SAM site, or the board to intervene.</p>
  </div>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s),cx=400,cy=248,D=Math.PI/180,f=n=>n.toFixed(1);
let H=190,Z=1;const zs=z=>z*Math.sqrt(Z),P=(x,y,z=0)=>[cx+.866*(x-y)*Z,cy+.5*(x+y)*Z-zs(z)];
const pt=a=>a.map(p=>f(p[0])+','+f(p[1])).join(' ');
const poly=(a,c)=>`<polygon points="${pt(a)}" class="${c}"/>`;
const box=(x0,y0,x1,y1,z0,z1)=>poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],'fl')+poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],'fr')+poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],'ft');
const sec=(r,a)=>`M0 0L${f(r*Math.cos(-a*D))} ${f(r*Math.sin(-a*D))}A${r} ${r} 0 0 1 ${f(r*Math.cos(a*D))} ${f(r*Math.sin(a*D))}Z`;
const mir=g=>g(1)+g(-1);
const mk=h=>{const F=h.concat(h.slice(1,-1).reverse().map(([x,y])=>[x,-y]));return'M'+F.map(p=>p.join(' ')).join('L')+'Z'};
const hullD0=mk([[28,0],[20,2],[9,3.3],[-9,17],[-14,17],[-15,4],[-24,3],[-26,1.6],[-27,0]]);
const B0=`<path class="acc" d="M-6 0H-20"/>`+mir(s=>`<path class="hl" d="M2.8 ${8*s}H-14.6M-2.4 ${12*s}H-14.3M-7 ${15.5*s}H-14.1"/><path class="hull" d="M16 ${2.47*s}L11.5 ${7.8*s}L9.5 ${7.8*s}L12 ${2.95*s}Z"/><rect class="dk" x="8.5" y="${s>0?2.7:-4.3}" width="4.5" height="1.6"/><rect class="dk" x="-13" y="${s>0?17.2:-18.4}" width="4" height="1.2"/>`)+`<circle class="dk" cx="-26.5" cy="0" r="1.8"/><ellipse class="cny" cx="12" cy="0" rx="5.5" ry="1.9"/><circle class="dk" cx="19.5" cy="0" r="1.1"/><path class="hl" d="M22.5 -1.2V1.2M24 -.8V.8"/>`;
const FM=()=>`matrix(${.866*Z} ${.5*Z} ${-.866*Z} ${.5*Z} ${cx} ${cy})`,RS=60,N=8,side=i=>i<4?0:1;
const jet=i=>`<g id="g${i}" class="${side(i)?'r':'b'}"><line class="pole" id="pl${i}"/><g id="jl${i}"><g transform="${FM()}"><g id="ps${i}"><g transform="translate(3.5 3.5)"><g id="rx${i}"><use href="#hull0" class="ext"/></g></g><g id="rb${i}"><use href="#hull0" class="hull"/>${B0}</g></g></g></g></g>`;
let SAMS=[];
function build(){
let g=`<defs><path id="hull0" d="${hullD0}"/><clipPath id="pc"><rect x="${-H+4}" y="${-H+4}" width="${2*H-8}" height="${2*H-8}" rx="10"/></clipPath></defs>`;
for(const[a,b]of[[-H+14,-H+14],[H-32,-H+14],[-H+14,H-32],[H-32,H-32]])g+=box(a,b,a+18,b+18,-20,-12);
g+=box(-H,-H,H,H,-12,0);
let fl=`<g transform="${FM()}"><g clip-path="url(#pc)">`;
for(let k=-Math.floor((H-20)/40)*40;k<=H-20;k+=40)fl+=`<path class="gl" d="M${k} ${-H}V${H}M${-H} ${k}H${H}"/>`;
for(let r=60;r<H-5;r+=60)fl+=`<circle class="gl rg" r="${r}"/>`;
fl+=`<text class="num" transform="rotate(-45) scale(${f(H/190)})" x="0" y="0" dy=".35em">404</text>`;
const c0=H*.68,all=[[-c0,-c0,1],[c0,-c0,1],[-c0,c0,0],[c0,c0,0],[0,-c0,1],[0,c0,0],[-c0,0,1],[c0,0,0]];SAMS=all.slice(0,H<200?4:H<300?6:8);
fl+=SAMS.map(([x,y,s],k)=>`<circle class="sr ${s?'r':'b'}" id="sr${k}" cx="${x}" cy="${y}" r="${RS}"/>`).join('');
for(let i=0;i<N;i++)fl+=`<g id="w${i}" class="wd ${side(i)?'r':'b'}"><path class="fan" id="fa${i}"/><path class="cone" id="co${i}"/></g>`;
for(let i=0;i<N;i++)fl+=`<g id="sh${i}"><use href="#hull0" class="shd"/></g><circle class="bs" id="bs${i}" r="4"/>`;
fl+=`</g><rect class="gl" style="stroke:var(--edge)" x="${-H+8}" y="${-H+8}" width="${2*H-16}" height="${2*H-16}" rx="8"/>`;
let tk='';for(let k=-H+10;k<=H-10;k+=10){const L=k%50?3.5:6.5;tk+=`M${k} ${H}v${-L}M${H} ${k}h${-L}`}
fl+=`<path class="gl" style="stroke:var(--edge)" d="${tk}"/>`;
g+=fl+'</g>';
SAMS.map((m,k)=>k).sort((a,b)=>SAMS[a][0]+SAMS[a][1]-SAMS[b][0]-SAMS[b][1]).forEach(k=>{const[x,y,s]=SAMS[k];const c=s?'--red':'--blue';g+=`<g class="sm" id="sm${k}">`+box(x-12,y-12,x+12,y+12,0,5)+box(x-8,y-8,x+8,y+8,5,8);for(let q=0;q<3;q++)g+=box(x-7,y-8+q*6,x+7,y-3.5+q*6,8,14);g+=box(x+10,y+6,x+13,y+9,0,22);const d=P(x+11.5,y+7.5,25);g+=`<ellipse class="sam" cx="${f(d[0])}" cy="${f(d[1])}" rx="5.8" ry="3.2" style="fill:var(${c})"/></g>`});
g+='<g id="jets">'+Array.from({length:N},(_,i)=>jet(i)).join('')+'</g><g id="lk"></g><g id="mg"></g><g id="fx"></g>';
$('#s').innerHTML=g;
}
const K={det:170,rf:.72,cone:40,W:1.1},V=62,sc=[0,0],M=[],ST={sh:[0,0],hit:[0,0],ch:[0,0],sk:[0,0],arm:[0,0],h:''};
let X=[],lure={t:0},T0=0,mid=0;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),hash=n=>Math.abs(Math.sin(n*12.9898)*43758.5453%1),cl=(v,a)=>Math.max(-a,Math.min(a,v));
const J=Array.from({length:N},(_,i)=>{const s=side(i),k=i%4,y0=[0,-55,55,-110][k];return{s,k,on:k<1?1:0,air:1,sead:k==2,x:s?135:-135,y:s?-y0:y0,h:s?Math.PI:0,z:[88,72,100,80][k],alive:k<1?1:0,cd:1+k*.5,lt:0,mode:'e',mt:0,ex:2,dir:1,zt:80,cw:0,jk:1,jt:0,rs:0,lk:-1,tr:0}});
let SM=[],EL=[],JS=.85;
function reset(){
Z=190/H;JS=.85*(.5+.5*Z)/Z;build();
SM=SAMS.map(([x,y,s],k)=>({x,y,s,z:8,cd:1.5+k,in:0,n:k+1,shots:0,kills:0,alive:1,rs:0,el:$('#sr'+k),gw:$('#sm'+k)}));
EL=J.map((_,i)=>Object.fromEntries(['g','sh','bs','w','jl','ps','rx','rb','pl','fa','co'].map(n=>[n,$('#'+n+i)])));
const q=H/190;
J.forEach((j,i)=>{const y0=[0,-55,55,-110][j.k]*q;Object.assign(j,{x:(j.s?1:-1)*135*q,y:j.s?-y0:y0,h:j.s?Math.PI:0,z:[88,72,100,80][j.k],alive:j.on?1:0,cd:1+j.k*.5,lt:0,mode:'e',mt:0,cw:0,jt:0,rs:0,lk:-1,tr:0});EL[i].fa.setAttribute('d',sec(K.det,55));EL[i].co.setAttribute('d',sec(K.det*K.rf,K.cone))});
M.length=0;X=[];sc[0]=sc[1]=0;Object.assign(ST,{sh:[0,0],hit:[0,0],ch:[0,0],sk:[0,0],arm:[0,0],h:''});T0=0;lure={t:0}}
reset();
const fire=(x,y,z,h,tg,side,v,w,p,src)=>M.push({x,y,z,h,tg,side,v,w,p,src,age:0,id:++mid,tr:[]});
const dist3=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y,(b.z-a.z)*.9);
function step(dt){
T0+=dt;lure.t-=dt;
J.forEach((j,i)=>{
if(!j.on)return;
if(!j.alive){j.rs-=dt;if(j.rs<=0){const q=H/190,p=[[-135,0],[-135,-55],[-135,55],[-135,-110]][j.k];j.x=(j.s?-p[0]:p[0])*q;j.y=(j.s?-p[1]:p[1])*q;j.h=Math.atan2(-j.y,-j.x);j.alive=1;j.cd=1.5;j.lt=0;j.mode='e';j.z=60+hash(T0*7+i)*50}return}
let o=null,od=1e9,sm=null,sd=1e9;
J.forEach(e=>{if(e.s!==j.s&&e.alive){const d=dist3(j,e);if(d<od){od=d;o=e}}});
if(j.sead)SM.forEach(m=>{if(m.s!==j.s&&m.alive){const d=Math.hypot(m.x-j.x,m.y-j.y);if(d<sd){sd=d;sm=m}}});
let w,zt;
if(sm){const dx=sm.x-j.x,dy=sm.y-j.y,aim=Math.atan2(dy,dx);
if(j.mode==='x'){w=aim+Math.PI+j.dir*.8;zt=110;j.mt+=dt;if(j.mt>j.ex){j.mode='e';j.mt=0}}
else{w=sd<RS+25?aim+Math.PI:aim;zt=70;if(sd<125&&sd>RS+25&&Math.abs(wrap(aim-j.h))<.5&&j.cd<=0){fire(j.x,j.y,j.z,aim,sm,j.s,150,2.6,.35);ST.arm[j.s]++;j.cd=6;j.mode='x';j.mt=0;j.ex=2.5;j.dir=-j.dir}}}
else{const dx=o?o.x-j.x:-j.x,dy=o?o.y-j.y:-j.y,rg=Math.hypot(dx,dy),beh=Math.cos(j.h)*dx+Math.sin(j.h)*dy<0;
j.mt+=dt;
